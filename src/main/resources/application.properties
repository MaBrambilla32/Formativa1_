# Configuración de conexión a Oracle Cloud usando Wallet
spring.datasource.url=jdbc:oracle:thin:@bancoxyz_high?TNS_ADMIN=./wallet
spring.datasource.username=ADMIN
spring.datasource.password=Renemaria1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de JPA / Hibernate para Oracle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilitar ejecución, tablas automáticas y compatibilidad con Oracle
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.isolation-level-for-create=READ_COMMITTED